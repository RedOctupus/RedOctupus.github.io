<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projects and achievements by Hongyu Zhang, including Lingnan Cup award work, AI workflow systems, computer vision, reinforcement learning, and applied AI delivery.">
  <title>Projects & Achievements | Hongyu Zhang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient-shell" aria-hidden="true">
    <div class="ambient-orb orb-a"></div>
    <div class="ambient-orb orb-b"></div>
    <div class="ambient-orb orb-c"></div>
    <div class="ambient-grid"></div>
  </div>
  <div class="scroll-progress" aria-hidden="true">
    <span id="scroll-progress-bar"></span>
  </div>

  <div class="page-shell projects-page-shell">
    <header class="topbar interactive-panel" data-glow>
      <a class="brand" href="index.html#home">
        <span class="brand-mark">HZ</span>
        <span class="brand-copy">
          <span class="brand-name">Hongyu Zhang</span>
          <span class="brand-role" id="brand-role"></span>
        </span>
      </a>
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>
      <div class="lang-switch" aria-label="Language switch">
        <button class="lang-button is-active" type="button" data-lang="en">EN</button>
        <button class="lang-button" type="button" data-lang="zh">中文</button>
      </div>
    </header>

    <main>
      <section class="projects-hero section-shell" id="projects-top">
        <div class="projects-hero-grid">
          <div class="projects-hero-copy">
            <a class="back-link reveal-item" data-reveal href="index.html#projects" id="back-link"></a>
            <p class="eyebrow reveal-item" data-reveal style="--reveal-delay: 30ms;" id="projects-eyebrow"></p>
            <h1 class="hero-title reveal-item" data-reveal style="--reveal-delay: 90ms;" id="projects-title"></h1>
            <p class="hero-summary reveal-item" data-reveal style="--reveal-delay: 150ms;" id="projects-subtitle"></p>
            <p class="project-page-typewriter reveal-item" data-reveal style="--reveal-delay: 210ms;">
              <span id="projects-type-prefix"></span>
              <span id="projects-type-phrase"></span>
              <span class="typewriter-caret" id="projects-type-caret" aria-hidden="true"></span>
            </p>
          </div>

          <div class="projects-hero-media reveal-item" data-reveal style="--reveal-delay: 180ms;">
            <figure class="project-hero-image interactive-panel" data-glow>
              <img src="assets/lingnan-cup/award-team.jpg" alt="" id="hero-award-image">
              <figcaption id="hero-award-caption"></figcaption>
            </figure>
            <figure class="project-hero-video interactive-panel" data-glow>
              <video controls preload="metadata" src="assets/lingnan-cup/interview.mp4"></video>
              <figcaption id="hero-video-caption"></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="section-shell compact-section">
        <div class="project-highlight-strip" id="project-highlights"></div>
      </section>

      <section class="section-shell" id="project-list">
        <div class="section-heading">
          <p class="section-index">01</p>
          <div>
            <h2 id="project-list-heading"></h2>
            <p class="section-lead" id="project-list-lead"></p>
          </div>
        </div>
        <div class="project-detail-grid" id="all-projects"></div>
      </section>

      <section class="section-shell" id="gallery">
        <div class="section-heading">
          <p class="section-index">02</p>
          <div>
            <h2 id="gallery-heading"></h2>
            <p class="section-lead" id="gallery-lead"></p>
          </div>
        </div>
        <div class="lingnan-gallery" id="lingnan-gallery"></div>
      </section>
    </main>

    <footer class="footer">
      <p id="footer-text"></p>
    </footer>
  </div>

  <script src="projects.js"></script>
</body>
</html>
